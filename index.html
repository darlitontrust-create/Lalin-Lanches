<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17181C" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lalin Lanches" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // tema salvo antes de desenhar a tela (evita piscar claro/escuro)
      try { var m = localStorage.getItem('lalin-mode'); if (m) document.documentElement.dataset.mode = m; } catch (e) {}
      document.documentElement.dataset.palette = 'mostarda'; // paleta oficial: carvão + mostarda
    </script>
    <style>
      /* Tela de abertura: logo centralizado + barra de progresso */
      #splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#F5F7FA;transition:opacity .35s ease}
      @media (prefers-color-scheme: dark){#splash{background:#121212}}
      html[data-mode=dark] #splash{background:#121212} html[data-mode=light] #splash{background:#F5F7FA}
      #splash{--l1:#E63946;--l2:#FF8A3D;--lm:#fff;--lm2:#FFC857;--b1:#E63946;--b2:#FFC857}
      html[data-palette=mostarda] #splash{background:#F7F4EC;--l1:#17181C;--l2:#2A2C33;--lm:#FFC21A;--lm2:#FFE39A;--b1:#FFC21A;--b2:#FFE39A}
      @media (prefers-color-scheme: dark){html[data-palette=mostarda] #splash{background:#121316}}
      html[data-palette=mostarda][data-mode=dark] #splash{background:#121316} html[data-palette=mostarda][data-mode=light] #splash{background:#F7F4EC}
      #splash .in{display:flex;flex-direction:column;align-items:center;gap:26px}
      #splash svg{width:112px;height:112px;filter:drop-shadow(0 14px 28px rgba(0,0,0,.25));animation:sp-pop .5s ease-out}
      #splash .bar{width:180px;height:6px;border-radius:3px;background:rgba(128,128,128,.22);overflow:hidden}
      #splash .bar i{display:block;height:100%;width:6%;border-radius:3px;background:linear-gradient(90deg,var(--b1),var(--b2));transition:width .35s ease}
      #splash.out{opacity:0;pointer-events:none}
      @keyframes sp-pop{from{transform:scale(.85);opacity:0}}
      @media (prefers-reduced-motion: reduce){#splash svg{animation:none}#splash,#splash .bar i{transition:none}}
    </style>
    <title>Lalin Lanches · Gestão</title>
  </head>
  <body>
    <div id="splash" role="progressbar" aria-label="Carregando o sistema">
      <div class="in">
        <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="spb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--l1)"/><stop offset="1" style="stop-color:var(--l2)"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#spb)"/><path d="M33 9C35.5 17 47 22 47 37C47 46 40.5 53 32 53C23.5 53 17 46.5 17 38C17 30.5 21 25.5 25.5 21.5C25.8 26.5 28 29.5 30.5 30.5C29 23.5 30.5 15.5 33 9Z" style="fill:var(--lm)"/><path d="M26.5 34.5a1.5 1.5 0 0 1 1.5-1.5h2.5a1.5 1.5 0 0 1 1.5 1.5V42H38a1.5 1.5 0 0 1 1.5 1.5v1.8a1.5 1.5 0 0 1-1.5 1.5H28a1.5 1.5 0 0 1-1.5-1.5Z" style="fill:var(--l1)"/><circle cx="45" cy="15" r="3.2" style="fill:var(--lm2)"/></svg>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script>
      (function () {
        var t0 = Date.now(), cur = 6, bar = document.querySelector('#splash .bar i');
        window.__splash = function (p) { if (p > cur) { cur = p; if (bar) bar.style.width = p + '%'; } };
        // avança sozinha enquanto o sistema carrega (nunca passa de 90% antes de terminar)
        var tick = setInterval(function () { window.__splash(cur + (90 - cur) * 0.07); }, 180);
        window.__splashDone = function () {
          var s = document.getElementById('splash');
          if (!s || s.dataset.done) return;
          s.dataset.done = '1'; clearInterval(tick); window.__splash(100);
          setTimeout(function () { s.classList.add('out'); setTimeout(function () { s.remove(); }, 400); }, Math.max(250, 700 - (Date.now() - t0)));
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
