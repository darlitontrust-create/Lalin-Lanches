<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E63946" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lalin Lanches" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // tema salvo antes de desenhar a tela (evita piscar claro/escuro)
      try { var m = localStorage.getItem('lalin-mode'); if (m) document.documentElement.dataset.mode = m; } catch (e) {}
    </script>
    <style>
      /* Tela de abertura: logo centralizado + barra de progresso */
      #splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#F5F7FA;transition:opacity .35s ease}
      @media (prefers-color-scheme: dark){#splash{background:#121212}}
      html[data-mode=dark] #splash{background:#121212} html[data-mode=light] #splash{background:#F5F7FA}
      #splash .in{display:flex;flex-direction:column;align-items:center;gap:26px}
      #splash svg{width:112px;height:112px;filter:drop-shadow(0 14px 28px rgba(230,57,70,.35));animation:sp-pop .5s ease-out}
      #splash .bar{width:180px;height:6px;border-radius:3px;background:rgba(128,128,128,.22);overflow:hidden}
      #splash .bar i{display:block;height:100%;width:6%;border-radius:3px;background:linear-gradient(90deg,#E63946,#FFC857);transition:width .35s ease}
      #splash.out{opacity:0;pointer-events:none}
      @keyframes sp-pop{from{transform:scale(.85);opacity:0}}
      @media (prefers-reduced-motion: reduce){#splash svg{animation:none}#splash,#splash .bar i{transition:none}}
    </style>
    <title>Lalin Lanches · Gestão</title>
  </head>
  <body>
    <div id="splash" role="progressbar" aria-label="Carregando o sistema">
      <div class="in">
        <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="spb" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#E63946"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient><linearGradient id="spg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#spb)"/><rect width="64" height="64" rx="18" fill="url(#spg)"/><path d="M14 48 50 30" stroke="#7a1d24" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/><path d="M33 9c1.5 8.5 13 13.5 13 27a14 14 0 0 1-28 0c0-7 3.5-11.5 7.5-15 .3 5.5 2.6 8.6 5.6 9.6C29 23 31.5 16 33 9z" fill="#fff"/><path d="M32.5 30c4 3 7 6.2 7 10.5a7.5 7.5 0 0 1-15 0c0-3 1.5-5 3.5-6.5.5 2.5 1.7 3.6 3.2 4-.8-3 0-5.7 1.3-8z" fill="#FFC857"/></svg>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script>
      (function () {
        var t0 = Date.now(), cur = 6, bar = document.querySelector('#splash .bar i');
        window.__splash = function (p) { if (p > cur) { cur = p; if (bar) bar.style.width = p + '%'; } };
        // avança sozinha enquanto o sistema carrega (nunca passa de 90% antes de terminar)
        var tick = setInterval(function () { window.__splash(cur + (90 - cur) * 0.07); }, 180);
        window.__splashDone = function () {
          var s = document.getElementById('splash');
          if (!s || s.dataset.done) return;
          s.dataset.done = '1'; clearInterval(tick); window.__splash(100);
          setTimeout(function () { s.classList.add('out'); setTimeout(function () { s.remove(); }, 400); }, Math.max(250, 700 - (Date.now() - t0)));
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
